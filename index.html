<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opportunities | Barker &amp; Stonehouse trading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15203b; --muted:#5b6478; --paper:#ffffff; --wash:#f2f1ef; --line:#dedbd6;
  --tan:#d9c5b7; --tan-deep:#7d6250;
  --moss:#4f6a3a; --ochre:#a8721c; --slate:#4f7391; --stone:#6f6f6f; --sage:#a9b4a0;
  --good:#3d6b3a; --check:#96650f; --fix:#a3322a;
  --serif:'Literata',Georgia,'Times New Roman',serif;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--wash);color:var(--ink);font:400 15px/1.55 var(--sans);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;line-height:1.25}
p{margin:0}
a{color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--slate);outline-offset:2px}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:#fff;padding:8px 12px;border-radius:4px;z-index:10}
.skip:focus{left:8px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

/* masthead */
.mast{background:var(--paper);border-bottom:1px solid var(--line)}
.mast .wrap{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-top:20px}
.brand{font-family:var(--serif);font-size:1.15rem;font-weight:600;letter-spacing:.01em}
.brand span{font-family:var(--sans);font-weight:400;color:var(--muted);font-size:.9rem;margin-left:10px}
.status{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.85rem;padding-bottom:6px}
.status button{background:none;border:1px solid var(--line);border-radius:4px;padding:5px 12px;cursor:pointer;background:var(--paper)}
.status button:hover{border-color:var(--ink)}
.tabs{display:flex;gap:4px;margin-top:14px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 16px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}

main.wrap{padding-top:32px;padding-bottom:64px}
.banner{background:var(--paper);border-left:4px solid var(--ochre);padding:12px 16px;margin-bottom:24px;border-radius:0 4px 4px 0}
.banner.err{border-left-color:var(--fix)}
.banner strong{font-weight:600}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:24px}
.gate{max-width:560px;margin:48px auto;text-align:left}
.gate h1{font-size:1.6rem;margin-bottom:10px}
.gate p{color:var(--muted);margin-bottom:18px}
.btn{display:inline-block;background:var(--ink);color:#fff;border:0;border-radius:4px;padding:11px 20px;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:#0c1429}
.btn.quiet{background:var(--paper);color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.quiet:hover{border-color:var(--ink);background:var(--paper)}
.linkish{background:none;border:0;padding:0;text-decoration:underline;cursor:pointer;color:var(--ink)}

/* overview hero */
.lede h1{font-size:clamp(1.6rem,3.4vw,2.35rem);max-width:28ch}
.lede p{margin-top:12px;max-width:62ch;color:var(--muted);font-size:1.05rem}
.tickets{display:grid;gap:12px;margin:28px 0 12px}
.ticket{display:grid;grid-template-columns:56px 1fr auto;align-items:stretch;background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.ticket .stub{background:var(--tan);position:relative;border-right:2px dashed rgba(21,32,59,.3)}
.ticket .stub::before{content:"";position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--wash);box-shadow:inset 0 1px 2px rgba(0,0,0,.28)}
.ticket .body{padding:16px 20px;min-width:0}
.ticket h3{font-size:1.15rem;overflow-wrap:anywhere}
.ticket .meta{color:var(--muted);margin-top:4px;font-size:.92rem}
.ticket .worth{padding:16px 22px;text-align:right;display:flex;flex-direction:column;justify-content:center;border-left:1px solid var(--line);min-width:150px}
.ticket .worth b{font-family:var(--serif);font-size:1.5rem;font-weight:600;line-height:1.1}
.ticket .worth small{color:var(--muted);font-size:.8rem;margin-top:4px}
.more{margin-top:8px}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px;margin-top:40px}
.panel h2{font-size:1.15rem;margin-bottom:6px}
.panel .sub{color:var(--muted);margin-bottom:18px;font-size:.92rem}
.bars{display:grid;gap:14px}
.bar{display:block;width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.bar:hover .track i{filter:brightness(1.12)}
.bar>span{display:block}
.bar .row{display:flex;justify-content:space-between;gap:12px;font-weight:500}
.bar .what{color:var(--muted);font-size:.85rem;font-weight:400;margin:2px 0 6px}
.track{height:10px;background:var(--wash);border-radius:2px;overflow:hidden}
.track i{display:block;height:100%}
.chartbox{position:relative;height:280px}
.stat{margin-top:14px;color:var(--muted);font-size:.92rem}

/* opportunities */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--paper);cursor:pointer;padding:8px 14px 8px 26px;font-weight:500;position:relative;
  clip-path:polygon(10px 0,100% 0,100% 100%,10px 100%,0 50%);border-radius:0 3px 3px 0}
.chip::before{content:"";position:absolute;left:11px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--wash);box-shadow:inset 0 0 0 1px var(--stone)}
.chip:hover{background:var(--wash)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip[aria-pressed="true"]::before{background:var(--tan);box-shadow:none}
.chip small{opacity:.75;margin-left:6px;font-weight:400}
.action{color:var(--muted);max-width:74ch;margin-bottom:18px}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.tools input,.tools select{font:inherit;border:1px solid var(--line);border-radius:4px;padding:8px 12px;background:var(--paper);color:var(--ink);min-width:0}
.tools input{flex:1 1 220px;max-width:340px}
.tablewrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
th{font-weight:600;font-size:.86rem;color:var(--muted);background:var(--paper);white-space:nowrap}
th button{background:none;border:0;padding:0;cursor:pointer;font-weight:600;color:inherit}
th button:hover{color:var(--ink)}
th[aria-sort="ascending"] button::after{content:" \25B2";font-size:.7em}
th[aria-sort="descending"] button::after{content:" \25BC";font-size:.7em}
td.num,th.num{text-align:right}
td.name{min-width:200px;max-width:340px}
td.wide{min-width:230px}
td.num small{display:block}
td.name a{text-underline-offset:3px}
td.name small{display:block;color:var(--muted)}
td.money{font-family:var(--serif);font-weight:600}
.empty{padding:32px;text-align:center;color:var(--muted)}
.foot{margin-top:14px;color:var(--muted);font-size:.9rem;max-width:80ch}
.note{margin-top:28px}

/* data health */
.hsec{margin-bottom:28px}
.hsec h2{font-size:1.15rem;margin-bottom:4px}
.hsec .sub{color:var(--muted);margin-bottom:12px;font-size:.92rem}
.pill{display:inline-block;font-weight:600;font-size:.84rem;white-space:nowrap}
.pill.good{color:var(--good)} .pill.check{color:var(--check)} .pill.fix{color:var(--fix)}

.loading{color:var(--muted);padding:24px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:820px){
  .grid2{grid-template-columns:1fr}
  .ticket{grid-template-columns:1fr}
  .ticket .stub{height:26px;border-right:0;border-bottom:2px dashed rgba(21,32,59,.3)}
  .ticket .stub::before{left:20px;top:50%}
  .ticket .worth{border-left:0;border-top:1px solid var(--line);text-align:left;flex-direction:row;align-items:baseline;gap:10px}
}
@media (max-width:560px){.wrap{padding-left:16px;padding-right:16px} main.wrap{padding-top:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* filters and shared bits */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
.filters select,.filters input[type="search"]{font:inherit;border:1px solid var(--line);border-radius:4px;padding:8px 12px;background:var(--paper);color:var(--ink);min-width:0}
.filters input[type="search"]{flex:1 1 220px;max-width:340px}
.check{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.nowrap{white-space:nowrap}
.money{font-family:var(--serif);font-weight:600}
td small{color:var(--muted)}
.fun{display:grid;gap:12px}
.fun .step{display:grid;grid-template-columns:170px 1fr 220px;gap:14px;align-items:center}
.fun .track{height:14px}
.fun small{color:var(--muted);margin-left:6px}
.lede + .filters,.lede + .tablewrap,.lede + .banner{margin-top:24px}
.lede + .hsec,.lede + .panel{margin-top:28px}
.hsec .panel{padding:20px}
@media (min-width:0){.tablewrap + .hsec,.panel + .hsec{margin-top:36px}}
@media (max-width:700px){.fun .step{grid-template-columns:1fr;gap:4px}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="mast">
  <div class="wrap">
    <div class="brand">Opportunities<span>Barker &amp; Stonehouse trading</span></div>
    <div class="status" id="status" aria-live="polite"></div>
  </div>
  <div class="wrap">
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>
</header>

<main id="main" class="wrap">
  <div id="banners"></div>
  <section id="gate" hidden></section>
  <div id="panels"></div>
</main>
<noscript><div class="wrap"><p>This dashboard needs JavaScript to load its data.</p></div></noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* ------------------------------------------------------------------
   Set-up: the OAuth client ID is the one your other dashboards use.
   Hosted on the same GitHub Pages domain, no change to the authorised
   origins is needed. Run the two scripts in /sql once before first use.
------------------------------------------------------------------- */
const CONFIG = {
  CLIENT_ID: '46227372300-rk63ag0caqgd7n12gjd0nt7f2qi7llqr.apps.googleusercontent.com',
  PROJECT: 'commanding-air-450109-p0',
  LOCATION: 'europe-west2',
  GSC_LOCATION: 'EU',
  SITE: 'https://www.barkerandstonehouse.co.uk'
};

/* ---------- queries ---------- */
const T = n => '`' + CONFIG.PROJECT + '.' + n + '`';
const SQL = {
  gap: `
WITH titles AS (
  SELECT ${T('bs_core.model_key')}(sku) AS mk, MAX(product_title) AS store_title
  FROM ${T('ometria.store_product_sales')}
  GROUP BY mk
)
SELECT g.product_group_id AS id,
  COALESCE(g.product_name, t.store_title) AS name,
  COALESCE(g.category, 'Uncategorised') AS category,
  g.gap_segment AS segment,
  g.store_qty_core AS store_units,
  g.store_revenue AS store_revenue,
  g.web_qty AS web_units,
  g.pdp_sessions AS visits,
  g.web_share_index AS share_index,
  g.est_web_gap_ex_vat AS opportunity,
  d.primary_url AS url
FROM ${T('bs_marts.omni_product_gap')} AS g
LEFT JOIN titles AS t ON t.mk = g.product_group_id
LEFT JOIN ${T('bs_core.dim_product_group')} AS d ON d.product_group_id = g.product_group_id
WHERE NOT REGEXP_CONTAINS(LOWER(COALESCE(g.product_name, t.store_title, '')), r'care kit|removal|delivery|assembly')`,
  period: `
SELECT CAST(MIN(period_start) AS STRING) AS start_date, CAST(MAX(period_end) AS STRING) AS end_date
FROM ${T('ometria.store_product_sales')}`,
  weekly: `
SELECT CAST(DATE_TRUNC(DATE(order_date, 'Europe/London'), WEEK(MONDAY)) AS STRING) AS wk,
  order_channel AS channel, COUNT(*) AS orders, ROUND(SUM(local_grand_total)) AS revenue
FROM ${T('ometria.orders_full')}
WHERE valid = 'Valid'
  AND DATE(order_date, 'Europe/London') >= DATE_SUB(DATE_TRUNC(CURRENT_DATE('Europe/London'), WEEK(MONDAY)), INTERVAL 26 WEEK)
  AND DATE(order_date, 'Europe/London') < DATE_TRUNC(CURRENT_DATE('Europe/London'), WEEK(MONDAY))
GROUP BY wk, channel
ORDER BY wk`,
  alerts: `
SELECT rule_code, entity_id, entity_name, est_gbp_week, est_clicks_week, priority, owner_pillar,
  recommended_action, evidence, run_count, CAST(first_seen AS STRING) AS first_seen
FROM ${T('bs_marts.trading_alerts')}
WHERE last_seen = (SELECT MAX(last_seen) FROM ${T('bs_marts.trading_alerts')})`,
  seoAlerts: `
SELECT rule_code, entity_id, entity_name, est_gbp_week, est_clicks_week, priority, owner_pillar,
  recommended_action, evidence, run_count, CAST(first_seen AS STRING) AS first_seen
FROM ${T('gsc_marts.seo_alerts')}
WHERE last_seen = (SELECT MAX(last_seen) FROM ${T('gsc_marts.seo_alerts')})`,
  organicRps: `
SELECT SAFE_DIVIDE(SUM(revenue), SUM(sessions)) AS rps
FROM ${T('bs_marts.channel_quality_28d')} WHERE channel_group = 'Organic Search'`,
  seoCtr: `
SELECT page, query, impressions, clicks, avg_position, ctr, expected_ctr, ctr_gap_clicks
FROM ${T('gsc_marts.query_page_opportunities')}
WHERE opportunity = 'Rewrite title and meta' ORDER BY ctr_gap_clicks DESC LIMIT 100`,
  seoNear: `
SELECT page, query, impressions, clicks, avg_position, ctr, rank_gap_clicks
FROM ${T('gsc_marts.query_page_opportunities')}
WHERE opportunity = 'Striking distance' ORDER BY impressions DESC LIMIT 100`,
  seoDrops: `
SELECT page, clicks_cur, clicks_prior, change_pct, site_change_pct, pos_cur, pos_prior
FROM ${T('gsc_marts.page_trend')}
WHERE clicks_prior >= 30 AND clicks_cur < clicks_prior ORDER BY clicks_prior - clicks_cur DESC LIMIT 50`,
  seoDaily: `
SELECT CAST(data_date AS STRING) AS d, segment, clicks, impressions
FROM ${T('gsc_marts.visibility_daily')} ORDER BY d`,
  channels: `
SELECT channel_group AS channel, SUM(sessions) AS sessions, SUM(engaged_sessions) AS engaged,
  SUM(cart_sessions) AS carts, SUM(purchase_sessions) AS orders, SUM(revenue) AS revenue
FROM ${T('bs_marts.channel_quality_28d')} GROUP BY channel ORDER BY sessions DESC`,
  pages: `
SELECT landing_path, page_type, channel_group, sessions, engaged_sessions, cart_sessions, purchase_sessions, revenue
FROM ${T('bs_marts.landing_pages_28d')}`,
  searchTerms: `
SELECT term, searches, sessions, zero_searches, sessions_with_click, click_rate, store_units, store_product, listed_online
FROM ${T('bs_marts.search_terms_28d')} ORDER BY searches DESC LIMIT 1000`,
  searchSummary: `SELECT raw_events, searches, zero_searches, searches_with_click FROM ${T('bs_marts.search_summary_28d')}`,
  seeStore: `SELECT product_group_id, product_name, product_category, store_name, requests FROM ${T('bs_marts.see_in_store_28d')}`,
  checkoutErrors: `
SELECT CAST(event_date AS STRING) AS d, kind, label, raw_label, step, detail, events, sessions
FROM ${T('bs_marts.checkout_errors_daily')}`,
  lists: `SELECT list_name, clicks, with_index, avg_index, top8_clicks, below12_clicks FROM ${T('bs_marts.plp_clicks_28d')} ORDER BY clicks DESC`,
  listItems: `SELECT list_name, product_group_id, product_name, clicks FROM ${T('bs_marts.plp_top_items_28d')} ORDER BY clicks DESC LIMIT 100`,
  products: `
SELECT product_group_id AS id, product_name AS name, category, primary_url AS url, pdp_sessions, cart_sessions,
  cart_rate, peer_median_cart_rate, est_gbp_week, merch_review
FROM ${T('bs_marts.pdp_scorecard')} ORDER BY est_gbp_week DESC LIMIT 2000`,
  funnel: `
SELECT CAST(event_date AS STRING) AS d, device, sessions, pdp_sessions, cart_sessions, checkout_sessions,
  shipping_sessions, payment_sessions, purchase_sessions, revenue
FROM ${T('bs_marts.checkout_funnel_daily')} ORDER BY d`,
  journeys: `SELECT bucket, sort_order, purchases, revenue, median_days FROM ${T('bs_marts.journey_days_90d')} ORDER BY sort_order`,
  ordersLatest: `SELECT CAST(MAX(DATE(order_date, 'Europe/London')) AS STRING) AS latest FROM ${T('ometria.orders_full')}`,
  ga4Latest: `
SELECT MAX(_TABLE_SUFFIX) AS latest FROM ${T('analytics_287404213.events_*')}
WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 10 DAY)) AND FORMAT_DATE('%Y%m%d', CURRENT_DATE())`,
  feed: `
SELECT COUNT(*) AS feed_rows,
  COUNTIF(product_type IS NULL OR TRIM(product_type) = '') AS no_type,
  COUNTIF(RTRIM(link, '/') = 'https://www.barkerandstonehouse.co.uk') AS home_links,
  (SELECT COUNT(*) FROM ${T('bs_core.dim_product_group')}) AS models
FROM ${T('google_ads_raw.product_feed')}`,
  mapped: `
SELECT SAFE_DIVIDE(SUM(IF(d.product_group_id IS NOT NULL, s.revenue_ex_vat, 0)), SUM(s.revenue_ex_vat)) AS mapped_share
FROM ${T('ometria.store_product_sales')} AS s
LEFT JOIN ${T('bs_core.dim_product_group')} AS d ON d.product_group_id = ${T('bs_core.model_key')}(s.sku)`,
  tracking: `
SELECT event_name, COUNT(*) AS events, COUNTIF(ARRAY_LENGTH(items) > 0) AS with_items,
  COUNTIF((SELECT COUNT(1) FROM UNNEST(event_params) AS p WHERE p.key = CASE event_name
    WHEN 'search' THEN 'number_of_results' WHEN 'see_in_store' THEN 'product_name' WHEN 'sample_order' THEN 'item_name' ELSE '' END) > 0) AS with_param
FROM ${T('analytics_287404213.events_*')}
WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 7 DAY)) AND FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY))
  AND event_name IN ('view_item_list','select_item','view_item','add_to_cart','begin_checkout','add_shipping_info','add_payment_info','purchase','search','view_search_results','sample_order','see_in_store','error_tracking')
GROUP BY event_name`,
  buildLog: `
SELECT step, status, message, CAST(finished_at AS STRING) AS finished FROM (
  SELECT *, ROW_NUMBER() OVER (PARTITION BY step ORDER BY finished_at DESC) AS rn FROM ${T('bs_core.build_log')}
) WHERE rn = 1 ORDER BY step`,
  gscLog: `
SELECT step, status, message, CAST(finished_at AS STRING) AS finished FROM (
  SELECT *, ROW_NUMBER() OVER (PARTITION BY step ORDER BY finished_at DESC) AS rn FROM ${T('gsc_marts.build_log')}
) WHERE rn = 1 ORDER BY step`
};

/* ---------- segments and rules ---------- */
const SEGMENTS = [
  {key:'1 Not listed online',   label:'Add to website',      colour:'var(--ink)',
   action:'These sell in store and are not on the website. List them, then check each one is worth listing (some may be store-only by design).'},
  {key:'2 Listed, undiscovered',label:'Make findable',       colour:'var(--moss)',
   action:'On the website, but few people reach the page compared with similar products. Improve navigation, on-site search, internal links and their place in category lists.'},
  {key:'3 Viewed, not added',   label:'Fix the page',        colour:'var(--ochre)',
   action:'People visit the page but fewer add to basket than for similar products. Review price, delivery, images and fabric options, and check whether customers prefer to try in store first.'},
  {key:'4 Under-indexing online',label:'Push traffic',       colour:'var(--slate)',
   action:'Sells well in store and less online than similar products. Feature it in Shopping, email and social, and add find-in-store prompts.'},
  {key:'0 Check mapping',       label:'Identify the product',colour:'var(--stone)',
   action:'The store code is numeric only, so it cannot be matched to a product. Look the code up in Ometria and add it to the mapping.'},
  {key:'OK',                    label:'On track',            colour:'var(--sage)',
   action:'Selling online at about the level of similar products.'}
];
const SEG = Object.fromEntries(SEGMENTS.map(s => [s.key, s]));
const RULES = {
  PDP_MERCH_REVIEW: 'Product page review', CHECKOUT_STEP_BREAK: 'Checkout step dropped', HIDDEN_GEM: 'Hidden gem',
  STORE_BESTSELLER_GAP: 'Store bestseller under-indexing', SEO_CTR: 'Rewrite title and meta', SEO_DROP: 'Organic visibility drop'
};

/* ---------- state ---------- */
const state = {
  demo: new URLSearchParams(location.search).has('demo'),
  rows: [], period: null, weekly: null,
  view: 'overview', segment: '1 Not listed online', q: '', cat: '',
  sort: {key: 'opportunity', dir: -1}, limit: 50, loadedAt: null,
  errors: {}, loading: false,
  act: {owner: '', confirmedOnly: true}, land: {type: '', channel: ''}, pp: {flagged: true, q: ''}, co: {device: ''}
};
const cache = {}, charts = {};
let accessToken = null, tokenExpiry = 0, tokenClient = null;

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gbp = n => n == null || isNaN(n) ? '\u2013' : '\u00A3' + Math.round(n).toLocaleString('en-GB');
const gbpK = n => '\u00A3' + (Math.abs(n) >= 100000 ? Math.round(n / 1000) : (n / 1000).toFixed(1).replace(/\.0$/, '')) + 'k';
const int = n => n == null || isNaN(n) ? '\u2013' : Math.round(n).toLocaleString('en-GB');
const pct = (n, d = 1) => n == null || isNaN(n) ? '\u2013' : (100 * n).toFixed(d) + '%';
const dmy = s => { const d = parse(s); return d ? d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric', timeZone:'UTC'}) : '\u2013'; };
const dm  = s => { const d = parse(s); return d ? d.toLocaleDateString('en-GB', {day:'numeric', month:'short', timeZone:'UTC'}) : '\u2013'; };
function parse(s){ if(!s) return null; s = String(s); if(/^\d{8}$/.test(s)) s = s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6); const d = new Date(s.slice(0,10) + 'T00:00:00Z'); return isNaN(d) ? null : d; }
function daysBehind(s){ const d = parse(s); if(!d) return null; const now = new Date(); return Math.round((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - d.getTime()) / 864e5); }
const plural = (n, one, many) => n === 1 ? one : many;
const pageLink = p => '<a href="' + esc(CONFIG.SITE + p) + '" target="_blank" rel="noopener">' + esc(p) + '</a>';
function mondayOf(s){ const d = parse(s); const day = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - day); return d.toISOString().slice(0, 10); }
const median = a => { const b = a.filter(x => x != null && !isNaN(x)).sort((x, y) => x - y); return b.length ? b[Math.floor(b.length / 2)] : null; };

function periodText(){
  const p = state.period; if(!p) return {span: 'the latest period', months: 'the latest period'};
  const days = Math.round((parse(p.end_date) - parse(p.start_date)) / 864e5) + 1;
  const m = Math.max(1, Math.round(days / 30.4));
  const words = {1:'one',2:'two',3:'three',4:'four',5:'five',6:'six'};
  return {span: dm(p.start_date) + ' to ' + dmy(p.end_date), months: (words[m] || m) + ' ' + plural(m, 'month', 'months')};
}

/* ---------- BigQuery ---------- */
class AuthError extends Error {}
async function bq(sql, location){
  location = location || CONFIG.LOCATION;
  const base = 'https://bigquery.googleapis.com/bigquery/v2/projects/' + CONFIG.PROJECT;
  const headers = {Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json'};
  let res = await fetch(base + '/queries', {method:'POST', headers,
    body: JSON.stringify({query: sql, useLegacySql: false, location, timeoutMs: 60000, maxResults: 10000})});
  if(res.status === 401) throw new AuthError('Your sign-in has expired.');
  let data = await res.json();
  if(!res.ok) throw new Error((data.error && data.error.message) || res.statusText);
  const jobId = data.jobReference.jobId;
  const poll = 'location=' + location + '&maxResults=10000';
  while(!data.jobComplete){
    await new Promise(r => setTimeout(r, 1000));
    res = await fetch(base + '/queries/' + jobId + '?' + poll + '&timeoutMs=30000', {headers});
    data = await res.json();
    if(!res.ok) throw new Error((data.error && data.error.message) || res.statusText);
  }
  const fields = data.schema.fields;
  let rows = data.rows || [], token = data.pageToken;
  while(token){
    res = await fetch(base + '/queries/' + jobId + '?' + poll + '&pageToken=' + encodeURIComponent(token), {headers});
    const d = await res.json();
    if(!res.ok) throw new Error((d.error && d.error.message) || res.statusText);
    rows = rows.concat(d.rows || []); token = d.pageToken;
  }
  return rows.map(r => Object.fromEntries(fields.map((f, i) => [f.name, cast(r.f[i].v, f.type)])));
}
function cast(v, type){
  if(v == null) return null;
  if(['INTEGER','INT64','FLOAT','FLOAT64','NUMERIC','BIGNUMERIC'].includes(type)) return Number(v);
  if(type === 'BOOLEAN' || type === 'BOOL') return v === 'true';
  return v;
}
const EU = sql => bq(sql, CONFIG.GSC_LOCATION);

async function loadAll(){
  state.loading = true; state.errors = {}; Object.keys(cache).forEach(k => delete cache[k]); renderStatus();
  $('#gate').hidden = true; showView(state.view);
  const jobs = {rows: bq(SQL.gap), period: bq(SQL.period), weekly: bq(SQL.weekly)};
  const keys = Object.keys(jobs);
  const results = await Promise.allSettled(keys.map(k => jobs[k]));
  const out = {}; let authFailed = false;
  results.forEach((r, i) => {
    if(r.status === 'fulfilled') out[keys[i]] = r.value;
    else { state.errors[keys[i]] = r.reason; if(r.reason instanceof AuthError) authFailed = true; }
  });
  if(authFailed){ accessToken = null; state.loading = false; showGate('Your sign-in has expired. Sign in again to reload the figures.'); renderStatus(); return; }
  if(out.rows) state.rows = out.rows;
  if(out.period && out.period[0]) state.period = out.period[0];
  if(out.weekly) state.weekly = out.weekly;
  state.loading = false; state.loadedAt = new Date();
  render();
}

function friendlyError(e, v){
  const msg = e && e.message ? e.message : String(e);
  const needs = TABS[v].needs;
  const missing = /not found|does not exist|Unrecognized name|Access Denied/i.test(msg);
  return '<div class="banner err"><strong>' + (missing && needs ? 'This tab needs data that is not there yet.' : 'Could not load this tab.') + '</strong> ' +
    (missing && needs ? 'Run ' + esc(needs) + ' once in BigQuery (see the README), then reload. ' : '') +
    'BigQuery said: ' + esc(msg) + '</div><p><button class="btn quiet" type="button" id="retry">Try again</button></p>';
}
function renderLazy(v){
  const t = TABS[v], el = $('#view-' + v);
  if(state.demo){ el.innerHTML = '<p class="loading">Sign in to load this tab. Sample mode covers the Overview and Store gap tabs.</p>'; return; }
  if(!accessToken){ el.innerHTML = ''; return; }
  let c = cache[v];
  if(!c){
    c = cache[v] = {status: 'loading'};
    el.innerHTML = '<p class="loading">Loading from BigQuery\u2026</p>';
    t.load().then(d => { c.status = 'ok'; c.data = d; })
      .catch(e => { c.status = 'error'; c.error = e; if(e instanceof AuthError){ accessToken = null; showGate('Your sign-in has expired. Sign in again to continue.'); } })
      .finally(() => { if(state.view === v && accessToken) renderLazy(v); });
    return;
  }
  if(c.status === 'loading'){ el.innerHTML = '<p class="loading">Loading from BigQuery\u2026</p>'; return; }
  if(c.status === 'error'){
    el.innerHTML = friendlyError(c.error, v);
    const r = $('#retry', el); if(r) r.addEventListener('click', () => { delete cache[v]; renderLazy(v); });
    return;
  }
  t.render(el, c.data);
}

function drawWeekly(){
  const canvas = $('#weekly'); if(!canvas) return;

  const v = (wk, ch) => { const r = state.weekly.find(x => x.wk === wk && x.channel === ch); return r ? r.revenue : 0; };
  const store = weeks.map(w => v(w, 'offline')), online = weeks.map(w => v(w, 'online'));
  const last = weeks.slice(-13);
  const sum = (arr, ws) => ws.reduce((t, w) => t + arr[weeks.indexOf(w)], 0);
  const s13 = sum(store, last), o13 = sum(online, last);
  const orders = ch => state.weekly.filter(r => r.channel === ch && last.includes(r.wk)).reduce((t, r) => t + r.orders, 0);
  const so = orders('offline'), oo = orders('online');
  if(stat && s13 + o13 > 0) stat.textContent = 'Online was ' + Math.round(100 * o13 / (s13 + o13)) + '% of order value over the last ' + last.length + ' complete weeks. The average order was ' + gbp(so ? s13 / so : null) + ' in store and ' + gbp(oo ? o13 / oo : null) + ' online.';
  if(!chart('weekly', {
    type: 'bar',
    data: {labels: weeks.map(dm), datasets: [
      {label: 'Store', data: store, backgroundColor: '#15203b', borderWidth: 0},
      {label: 'Online', data: online, backgroundColor: '#c4a48c', borderWidth: 0}]},
    options: {responsive: true, maintainAspectRatio: false,
      scales: {x: {stacked: true, grid: {display: false}, ticks: {maxRotation: 0, autoSkip: true, maxTicksLimit: 9}},
               y: {stacked: true, ticks: {callback: v => v >= 1e6 ? '\u00A3' + +(v / 1e6).toFixed(1) + 'm' : '\u00A3' + (v / 1000) + 'k'}, grid: {color: '#e8e5e0'}}},
      plugins: {legend: {position: 'bottom', labels: {boxWidth: 12, boxHeight: 12}}, tooltip: {callbacks: {label: c => c.dataset.label + ': ' + gbp(c.parsed.y)}}}}
  })) canvas.parentElement.innerHTML = '<p class="loading">The chart library did not load. The figures above still apply.</p>';
}

function filteredRows(){
  const q = state.q.trim().toLowerCase();
  let rows = state.rows.filter(r => state.segment === 'ALL' || r.segment === state.segment);
  if(q) rows = rows.filter(r => (r.name || '').toLowerCase().includes(q) || (r.id || '').toLowerCase().includes(q));
  if(state.cat) rows = rows.filter(r => r.category === state.cat);
  const {key, dir} = state.sort;
  rows.sort((a, b) => {
    const x = a[key], y = b[key];
    if(x == null && y == null) return 0; if(x == null) return 1; if(y == null) return -1;

function columnsFor(seg){

function renderTable(){
  const host = $('#tablehost'); if(!host) return;

function downloadCsv(){
  const rows = filteredRows();

  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
  a.download = 'opportunities-' + (SEG[state.segment] ? SEG[state.segment].label.toLowerCase().replace(/\s+/g, '-') : 'all') + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

           {label: 'Average position', num: true, get: r => r.avg_index == null ? '\u2013' : r.avg_index}, {label: 'In top 8', num: true, get: r => r.with_index ? pct(r.top8_clicks / r.with_index, 0) : '\u2013'}, {label: 'Below 12', num: true, get: r => r.with_index ? pct(r.below12_clicks / r.with_index, 0) : '\u2013'}], d.lists, {limit: 30})) +

/* ---------- product pages ---------- */
async function loadProducts(){
  const rs = await Promise.allSettled([bq(SQL.products), bq(SQL.seeStore)]);
  failIfAuth(rs);
  if(rs[0].status === 'rejected') throw rs[0].reason;

function renderProducts(el, d){
  const rows = d.rows;
  const flagged = rows.filter(r => r.merch_review), sum = flagged.reduce((t, r) => t + (r.est_gbp_week || 0), 0);

      flagged.length ? 'Fixing them is worth about ' + gbpK(sum) + ' a week. A page is flagged when it is in the top fifth of its category for visits and its add-to-basket rate is under half the category median.' : 'Pages are compared with others in their category over the last 28 days.') +
    '<div class="filters"><label class="sr" for="pq">Search products</label><input id="pq" type="search" placeholder="Search by name or code" value="' + esc(state.pp.q) + '"><label class="check"><input type="checkbox" id="pf"' + (state.pp.flagged ? ' checked' : '') + '> Flagged pages only</label></div>' +
    tbl([{label: 'Product', get: r => (r.url && r.url !== '/' ? '<a href="' + esc(CONFIG.SITE + r.url) + '" target="_blank" rel="noopener">' + esc(r.name) + '</a>' : esc(r.name)) + '<small>' + esc(r.id) + '</small>', cls: 'name'},
         {label: 'Worth a week', num: true, get: r => r.est_gbp_week ? '<span class="money">' + gbp(r.est_gbp_week) + '</span>' : '\u2013'}, {label: 'Category', get: r => esc(r.category)}, {label: 'Visits', num: true, get: r => int(r.pdp_sessions)},
         {label: 'Add to basket', num: true, get: r => pct(r.cart_rate)}, {label: 'Category median', num: true, get: r => pct(r.peer_median_cart_rate)}], list, {limit: 40, empty: 'No products match.'}) +
    findInStore(d, rows) +

  $('#pq', el).addEventListener('input', e => { state.pp.q = e.target.value; const pos = e.target.selectionStart; renderProducts(el, d); const n = $('#pq', el); n.focus(); n.setSelectionRange(pos, pos); });

function findInStore(d, rows){
  if(d.storeErr) return '<div class="banner"><strong>Find in store is missing.</strong> Re-run 01_build_europe-west2.sql to add it. BigQuery said: ' + esc(d.storeErr.message) + '</div>';
  const total = d.store.reduce((t, r) => t + r.requests, 0);
  if(!total) return '';
  const byId = new Map(rows.map(r => [r.id, r]));
  const prods = new Map(), stores = new Map();
  d.store.forEach(r => {
    const k = r.product_name || '(unknown)'; const o = prods.get(k) || {name: k, id: r.product_group_id, requests: 0}; o.requests += r.requests; if(!o.id) o.id = r.product_group_id; prods.set(k, o);
    stores.set(r.store_name || '(unknown)', (stores.get(r.store_name || '(unknown)') || 0) + r.requests);
  });
  const plist = [...prods.values()].map(o => { const m = o.id ? byId.get(o.id) : null; return {...o, visits: m ? m.pdp_sessions : null, cart: m ? m.cart_rate : null}; }).sort((a, b) => b.requests - a.requests);
  const slist = [...stores.entries()].map(([name, n]) => ({name, n})).sort((a, b) => b.n - a.n);
  return sec('Products people ask to see in store', int(total) + ' find-in-store clicks in 28 days across ' + plist.length + ' products. A product with many requests and a low add-to-basket rate may be one customers want to try before buying.',
      tbl([{label: 'Product', get: r => esc(r.name), cls: 'name'}, {label: 'Requests', num: true, get: r => int(r.requests)}, {label: 'Page visits', num: true, get: r => int(r.visits)},
           {label: 'Requests per 100 visits', num: true, get: r => r.visits ? (100 * r.requests / r.visits).toFixed(1) : '\u2013'}, {label: 'Add to basket', num: true, get: r => pct(r.cart)}], plist, {limit: 15})) +
    sec('Find in store by showroom', '', tbl([{label: 'Showroom', get: r => esc(r.name)}, {label: 'Requests', num: true, get: r => int(r.n)}, {label: 'Share', num: true, get: r => pct(r.n / total, 0)}], slist, {limit: 15}));
}

/* ---------- checkout ---------- */
async function loadCheckout(){
  const rs = await Promise.allSettled([bq(SQL.funnel), bq(SQL.checkoutErrors)]);
  failIfAuth(rs);
  if(rs[0].status === 'rejected') throw rs[0].reason;
  return {funnel: rs[0].value, errors: val(rs[1]) || [], errErr: rs[1].status === 'rejected' ? rs[1].reason : null};
}
function renderCheckout(el, d){
  const all = d.funnel;
  const devices = [...new Set(all.map(r => r.device))].sort();
  const rows = all.filter(r => !state.co.device || r.device === state.co.device);
  const days = [...new Set(rows.map(r => r.d))].sort();
  const sumBy = (ds, k) => rows.filter(r => ds.includes(r.d)).reduce((t, r) => t + r[k], 0);
  const last28 = days.slice(-28);
  const STEPS = [['sessions','Visits'],['pdp_sessions','Viewed a product'],['cart_sessions','Added to basket'],['checkout_sessions','Started checkout'],['shipping_sessions','Chose delivery'],['payment_sessions','Entered payment'],['purchase_sessions','Bought']];
  const steps = STEPS.map(([k, l]) => ({k, l, n: sumBy(last28, k)})).filter(s => s.n > 0);
  const max = steps.length ? steps[0].n : 1;
  const funnel = '<div class="fun">' + steps.map((s, i) => '<div class="step"><span>' + esc(s.l) + '</span><span class="track"><i style="width:' + Math.max(2, Math.round(100 * s.n / max)) + '%;background:var(--ink)"></i></span><span>' + int(s.n) + (i ? ' <small>' + pct(s.n / steps[i - 1].n, 0) + ' of ' + esc(steps[i - 1].l.toLowerCase()) + '</small>' : '') + '</span></div>').join('') + '</div>';
  const roll = (num, den, i) => { const ds = days.slice(Math.max(0, i - 6), i + 1); const n = sumBy(ds, num), m = sumBy(ds, den); return m ? n / m : null; };
  const recent = days.slice(-42), off = days.length - recent.length;
  const comp = recent.map((_, i) => roll('purchase_sessions', 'checkout_sessions', off + i)), toChk = recent.map((_, i) => roll('checkout_sessions', 'cart_sessions', off + i));
  const chkCompl = sumBy(last28, 'checkout_sessions') ? sumBy(last28, 'purchase_sessions') / sumBy(last28, 'checkout_sessions') : null;
  const tail = days.slice(-14).reverse().map(dd => ({d: dd, v: sumBy([dd], 'sessions'), c: sumBy([dd], 'cart_sessions'), k: sumBy([dd], 'checkout_sessions'), p: sumBy([dd], 'purchase_sessions')}));
  el.innerHTML = lede(chkCompl != null ? pct(chkCompl, 0) + ' of visits that start checkout go on to buy.' : 'Checkout over the last 28 days.', 'Each step counts visits that reached it, so a step cannot be higher than the one before it. Bought counts visits that started checkout and completed an order.') +
    '<div class="filters"><label class="sr" for="dev">Device</label><select id="dev"><option value="">All devices</option>' + devices.map(t => '<option' + (state.co.device === t ? ' selected' : '') + '>' + esc(t) + '</option>').join('') + '</select></div>' +
    '<div class="panel">' + funnel + '</div>' +
    sec('Completion over time', 'Seven-day rolling rates. A sudden step down in either line is what the checkout alert watches for.', '<div class="panel">' + chartBox('cochart', 'Line chart of basket to checkout and checkout to purchase rates') + '</div>') +
    sec('Last 14 days', '', tbl([{label: 'Day', get: r => dm(r.d)}, {label: 'Visits', num: true, get: r => int(r.v)}, {label: 'Baskets', num: true, get: r => int(r.c)}, {label: 'Checkouts', num: true, get: r => int(r.k)}, {label: 'Bought', num: true, get: r => int(r.p)},
         {label: 'Basket to checkout', num: true, get: r => r.c ? pct(r.k / r.c, 0) : '\u2013'}, {label: 'Checkout to bought', num: true, get: r => r.k ? pct(r.p / r.k, 0) : '\u2013'}], tail, {limit: 14})) +
    checkoutErrorsHtml(d) +
    '<p class="foot">Delivery and payment steps only appear when the site records them. Express payment buttons can skip the payment step, so it can read lower than it is.</p>';
  $('#dev', el).addEventListener('change', e => { state.co.device = e.target.value; renderCheckout(el, d); });
  chart('cochart', {type: 'line', data: {labels: recent.map(dm), datasets: [
    {label: 'Checkout to bought', data: comp.map(v => v == null ? null : +(100 * v).toFixed(1)), borderColor: '#15203b', backgroundColor: '#15203b', tension: .25, pointRadius: 0, borderWidth: 2},
    {label: 'Basket to checkout', data: toChk.map(v => v == null ? null : +(100 * v).toFixed(1)), borderColor: '#a8721c', backgroundColor: '#a8721c', tension: .25, pointRadius: 0, borderWidth: 2}]},
    options: {responsive: true, maintainAspectRatio: false, scales: {x: {grid: {display: false}, ticks: {maxTicksLimit: 8, maxRotation: 0}}, y: {ticks: {callback: v => v + '%'}, grid: {color: '#e8e5e0'}}}, plugins: {legend: {position: 'bottom', labels: {boxWidth: 12, boxHeight: 12}}}}});
}

function checkoutErrorsHtml(d){
  if(d.errErr) return '<div class="banner"><strong>Checkout errors are missing.</strong> Re-run 01_build_europe-west2.sql to add them. BigQuery said: ' + esc(d.errErr.message) + '</div>';
  if(!d.errors.length) return '';
  const maxd = d.errors.reduce((m, r) => r.d > m ? r.d : m, '');
  const cut = new Date(parse(maxd).getTime() - 27 * 864e5).toISOString().slice(0, 10);
  const rows = d.errors.filter(r => r.d >= cut);
  const forms = new Map(), coupons = new Map();
  rows.filter(r => r.kind === 'form').forEach(r => {
    const k = (r.label || '(unnamed)') + '|' + (r.step || ''); const o = forms.get(k) || {form: r.label || '(unnamed)', step: r.step, events: 0, sessions: 0, details: new Map()};
    o.events += r.events; o.sessions += r.sessions; if(r.detail) o.details.set(r.detail, (o.details.get(r.detail) || 0) + r.events); forms.set(k, o);
  });
  rows.filter(r => r.kind === 'coupon').forEach(r => {
    const o = coupons.get(r.label) || {code: r.label, events: 0, raw: new Set()}; o.events += r.events; o.raw.add(r.raw_label); coupons.set(r.label, o);
  });
  const fl = [...forms.values()].map(o => ({...o, top: [...o.details.entries()].sort((a, b) => b[1] - a[1]).map(x => x[0])[0] || ''})).sort((a, b) => b.events - a.events);
  const cl = [...coupons.values()].sort((a, b) => b.events - a.events);
  const ft = fl.reduce((t, r) => t + r.events, 0), ct = cl.reduce((t, r) => t + r.events, 0);
  return sec('Form errors at checkout', int(ft) + ' form errors in the last 28 days. Browser and third-party script errors are left out.',
      tbl([{label: 'Form', get: r => esc(r.form)}, {label: 'Step', get: r => esc(r.step || '')}, {label: 'Errors', num: true, get: r => int(r.events)}, {label: 'Most common message', get: r => esc(r.top), cls: 'name'}], fl, {limit: 12, empty: 'No form errors recorded.'})) +
    sec('Coupon codes that failed', int(ct) + ' failed attempts across ' + cl.length + ' ' + plural(cl.length, 'code', 'codes') + '. A code typed in several ways, such as WELCOME15 and Welcome15, may mean the till is case-sensitive.',
      tbl([{label: 'Code', get: r => esc(r.code)}, {label: 'Failed attempts', num: true, get: r => int(r.events)}, {label: 'Typed in', num: true, get: r => r.raw.size + ' ' + plural(r.raw.size, 'way', 'ways')}, {label: 'Seen as', get: r => esc([...r.raw].slice(0, 4).join(', ')), cls: 'name'}], cl, {limit: 12, empty: 'No coupon failures recorded.'}));
}

/* ---------- journeys ---------- */
async function loadJourneys(){ return bq(SQL.journeys); }
function renderJourneys(el, rows){
  const total = rows.reduce((t, r) => t + r.purchases, 0), med = rows.length ? rows[0].median_days : null;

      'Days between a browser\u2019s first visit and its order, for the last 90 days. Consideration this long is why the dashboard judges pages on 28-day and 90-day views and not on same-session sales.') +
    '<div class="panel"><div class="bars">' + rows.map(r => '<div class="bar"><span class="row"><span>' + esc(r.bucket) + '</span><span>' + int(r.purchases) + ' orders, ' + pct(r.purchases / total, 0) + '</span></span><span class="what">' + gbp(r.revenue) + ' of order value</span><span class="track"><i style="width:' + Math.max(2, Math.round(100 * r.purchases / max)) + '%;background:var(--slate)"></i></span></div>').join('') + '</div></div>' +

/* ---------- data health ---------- */
const PILL = {good: '\u2713 Good', check: '! Check', fix: '\u2715 Fix'};
const pill = (level, text) => '<span class="pill ' + level + '">' + PILL[level] + (text ? ' \u2013 ' + esc(text) : '') + '</span>';
async function loadHealth(){
  const keys = ['ordersLatest','ga4Latest','feed','mapped','tracking','buildLog'];
  const rs = await Promise.allSettled([bq(SQL.ordersLatest), bq(SQL.ga4Latest), bq(SQL.feed), bq(SQL.mapped), bq(SQL.tracking), bq(SQL.buildLog), EU(SQL.gscLog)]);
  failIfAuth(rs);
  const v = i => val(rs[i]);
  return {ordersLatest: v(0) && v(0)[0] && v(0)[0].latest, ga4Latest: v(1) && v(1)[0] && v(1)[0].latest, feed: v(2) && v(2)[0], mapped: v(3) && v(3)[0] && v(3)[0].mapped_share, tracking: v(4), buildLog: v(5), gscLog: v(6)};
}
function renderHealth(el, h){
  const fresh = (label, latest, okDays, warnDays, note) => {
    const d = daysBehind(latest), level = d == null ? 'fix' : d <= okDays ? 'good' : d <= warnDays ? 'check' : 'fix';
    return '<tr><td>' + esc(label) + '</td><td>' + (latest ? dmy(latest) : '\u2013') + '</td><td>' + (d == null ? 'Not loaded' : d + ' ' + plural(d, 'day', 'days') + ' old') + '</td><td>' + pill(level) + '</td><td>' + esc(note) + '</td></tr>';
  };
  let html = sec('Did the overnight build work?', 'The latest result for each step of the two build scripts. A step that fails does not stop the others.', (() => {
    const rows = (h.buildLog || []).map(r => ({...r, area: 'Main build'})).concat((h.gscLog || []).map(r => ({...r, area: 'Search Console build'})));
    return tbl([{label: 'Build', get: r => esc(r.area)}, {label: 'Step', get: r => esc(r.step)}, {label: 'Result', get: r => r.status === 'ok' ? pill('good') : pill('fix')}, {label: 'Last run', get: r => r.finished ? dmy(r.finished) + ' ' + esc(String(r.finished).slice(11, 16)) : '\u2013'}, {label: 'Message', get: r => esc(r.message || ''), cls: 'name'}],
      rows, {limit: 60, empty: 'The build has not run yet. Run the two scripts in the sql folder, then schedule them.'});
  })());
  html += sec('Is the data up to date?', 'Ometria is reloaded by hand each week. If it is more than a week old, sales comparisons with GA4 will look wrong.',
    '<div class="tablewrap"><table><thead><tr><th>Source</th><th>Latest date</th><th>Age</th><th>Status</th><th>What to do</th></tr></thead><tbody>' +
    fresh('Ometria orders', h.ordersLatest, 8, 14, 'Reload orders_full weekly.') +
    fresh('Store sales by product', state.period && state.period.end_date, 8, 14, 'Append the last complete week each week.') +
    fresh('GA4 export', h.ga4Latest, 2, 4, 'The daily export lands the next morning.') + '</tbody></table></div>');
  const m = h.mapped, ml = m == null ? 'fix' : m >= 0.95 ? 'good' : m >= 0.9 ? 'check' : 'fix';
  html += sec('Do store products match the website?', 'The share of store sales that lands on a product model in the feed. The opportunity list is reliable from 95%.',
    '<div class="tablewrap"><table><thead><tr><th>Check</th><th class="num">Result</th><th>Status</th></tr></thead><tbody><tr><td>Store sales matched to a model in the feed</td><td class="num">' + (m == null ? '\u2013' : (100 * m).toFixed(1) + '%') + '</td><td>' + pill(ml) + '</td></tr></tbody></table></div>');
  const f = h.feed;
  if(f){
    const fl = n => n === 0 ? 'good' : (n / f.feed_rows) < 0.02 ? 'check' : 'fix';
    html += sec('Is the product feed clean?', int(f.feed_rows) + ' feed rows roll up to ' + int(f.models) + ' models. Fix these in Feedonomics.',
      '<div class="tablewrap"><table><thead><tr><th>Check</th><th class="num">Rows</th><th class="num">Share</th><th>Status</th><th>Why it matters</th></tr></thead><tbody>' +
      '<tr><td>No product type</td><td class="num">' + int(f.no_type) + '</td><td class="num">' + (100 * f.no_type / f.feed_rows).toFixed(1) + '%</td><td>' + pill(fl(f.no_type)) + '</td><td>These models cannot be compared with similar products by category.</td></tr>' +
      '<tr><td>Link goes to the homepage</td><td class="num">' + int(f.home_links) + '</td><td class="num">' + (100 * f.home_links / f.feed_rows).toFixed(1) + '%</td><td>' + pill(fl(f.home_links)) + '</td><td>Shopping ads for these products land on the homepage, not the product page.</td></tr></tbody></table></div>');
  }
  const ev = Object.fromEntries((h.tracking || []).map(r => [r.event_name, r]));
  const off = r => !r || r.events === 0;
  const item = (r) => off(r) ? ['fix', 'Not firing'] : (r.with_items / r.events < 0.5 ? ['check', 'No product on the event'] : ['good', '']);
  const on = r => off(r) ? ['fix', 'Not firing'] : ['good', ''];
  const tr = [
    ['view_item_list', 'Product list views', 'Needed for how each list position performs.', on],
    ['select_item', 'Product clicks from lists', 'Needed for list position analysis.', on],
    ['view_item', 'Product page views', 'Feeds page visits in the opportunity list.', on],
    ['add_to_cart', 'Add to basket', 'Feeds the Fix the page test.', on],
    ['begin_checkout', 'Started checkout', 'Feeds the checkout funnel.', on],
    ['add_shipping_info', 'Chose delivery', 'Optional checkout step. Without it the funnel skips delivery.', r => off(r) ? ['check', 'Not firing'] : ['good', '']],
    ['add_payment_info', 'Entered payment', 'Optional checkout step. Without it the funnel skips payment.', r => off(r) ? ['check', 'Not firing'] : ['good', '']],
    ['purchase', 'Purchases', 'Feeds online units sold.', on],
    ['sample_order', 'Swatch requests', 'Records the fabric ordered, not the product it was ordered for, so swatches cannot yet be tied to products.', r => off(r) ? ['fix', 'Not firing'] : ['check', 'Fabric only']],
    ['see_in_store', 'Find in store', 'Records product, category and showroom. Feeds Product pages.', r => off(r) ? ['fix', 'Not firing'] : (r.with_param / r.events > 0.9 ? ['good', ''] : ['check', 'Product name missing on some'])],
    ['search', 'On-site searches', 'Records the number of results (up to four) as people type. Feeds Site search.', r => off(r) ? ['fix', 'Not firing'] : (r.with_param / r.events > 0.9 ? ['good', ''] : ['check', 'Result count missing on some'])],
    ['error_tracking', 'Errors', 'Mostly browser and third-party script noise. The form and coupon errors in it feed the Checkout tab.', r => off(r) ? ['check', 'Not firing'] : ['check', 'Mostly noise']]
  ];
  html += sec('Is tracking capturing what this dashboard needs?', 'GA4 events in the last seven complete days.',
    '<div class="tablewrap"><table><thead><tr><th>Event</th><th class="num">Events</th><th class="num">With items</th><th>Status</th><th>Why it matters</th></tr></thead><tbody>' +
    tr.map(([name, label, why, fn]) => { const r = ev[name]; const [lvl, txt] = fn(r); return '<tr><td>' + esc(label) + '<small style="display:block;color:var(--muted)">' + esc(name) + '</small></td><td class="num">' + (r ? int(r.events) : '0') + '</td><td class="num">' + (r ? int(r.with_items) : '0') + '</td><td>' + pill(lvl, txt) + '</td><td>' + esc(why) + '</td></tr>'; }).join('') + '</tbody></table></div>');
  el.innerHTML = html;
}
